name: Mesa Cripto
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/run_cripto.py
      - run: |
          git config user.name "agentes"
          git config user.email "agentes@users.noreply.github.com"
          git add data/signals.json
          git commit -m "sinais" || exit 0
          git push
